[project]
name = "juggle-api"
version = "0.1.0"
description = "Juggle — kids' holiday-activities & birthday-party booking marketplace (API)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.8",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "import-linter>=2.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/juggle"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["juggle"]
strict = true
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------------------
# import-linter: enforce module boundaries (PRD §10.4, §12 — "core/ui split").
# Run with:  uv run lint-imports
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "juggle"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain core must not import the web layer (ui) or FastAPI"
type = "forbidden"
source_modules = [
    "juggle.modules.identity.core",
    "juggle.modules.org.core",
    "juggle.modules.catalog.core",
    "juggle.modules.inventory.core",
    "juggle.modules.booking.core",
    "juggle.modules.payments.core",
    "juggle.modules.roster.core",
    "juggle.modules.notifications.core",
    "juggle.modules.search.core",
    "juggle.modules.admin.core",
    "juggle.modules.config.core",
    "juggle.modules.flags.core",
    "juggle.modules.audit.core",
]
forbidden_modules = ["fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "Modules are independent (no cross-module imports of internals)"
type = "independence"
modules = [
    "juggle.modules.identity",
    "juggle.modules.org",
    "juggle.modules.catalog",
    "juggle.modules.inventory",
    "juggle.modules.booking",
    "juggle.modules.payments",
    "juggle.modules.roster",
    "juggle.modules.notifications",
    "juggle.modules.search",
    "juggle.modules.admin",
    "juggle.modules.config",
    "juggle.modules.flags",
    "juggle.modules.audit",
]
